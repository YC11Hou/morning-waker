# Copy to config.local.toml (gitignored) and fill in your values. All times use [general].timezone.

[general]
timezone = "UTC"

[imessage]
# Your own phone number in E.164 form; must be the iMessage number of the Apple ID signed in on this Mac.
self = "+10000000000"

[wake]
time = "09:00"
weekdays = [1, 2, 3, 4, 5, 6, 7]
hard_timeout_min = 60

[bedtime]
enabled = true
remind_at = "23:30"
keywords = ["bed", "sleep", "goodnight"]

[reminders]
# A daily repeating reminder is created in this existing list; completing the day's occurrence on your phone is the check-in.
enabled = true
list = "Reminders"
title = "☀️ Wake-up check-in"
create_ahead_min = 60

[checkin]
# "reminder": completing the day's reminder (or `morningwaker checkin`) is the check-in.
# "gate": only the local gate page counts (http://127.0.0.1:<port>/, unreachable from the phone); the reminder is just an alarm.
mode = "reminder"

[gate]
port = 5181
open_before_min = 60

# Gate checks, used only in gate mode; every check that is not waived must pass. Keep real values in config.local.toml.
# [[gate.check]]
# name = "wake"
# type = "button"
# button = "I'm up"
# silences_alarm = true
#
# [[gate.check]]
# name = "question"
# type = "plugin"
# module = "plugins/question_bank.py"
# bank = "plugins/questions.example.toml"
# min_chars = 60
# silences_alarm = true
#
# [[gate.check]]
# name = "place"
# type = "location"
# lat = 0.0
# lon = 0.0
# radius_m = 1000
# waive_if_reminder = ["interview"]
# waive_exclude = ["confirm"]

[alarm]
enabled = true
# Apple's "Radial" alarm tone from the system ToneLibrary; any afplay-readable file works.
sound = "/System/Library/PrivateFrameworks/ToneLibrary.framework/Versions/A/Resources/Ringtones/Radial-EncoreInfinitum.m4r"
# System output volume, pinned while ringing; the tone itself ramps from start_level to end_level over ramp_sec.
volume = 80
builtin_speakers = true
start_level = 0.35
end_level = 1.0
ramp_sec = 60
interval_sec = 1
max_ring_min = 30

# Steps run after_min minutes past wake time without a check-in: notify = message you, tattle = message `to`, shell = run cmd.
# In gate mode, unless_passed = ["<check>"] skips a step once those checks have passed or are waived.
[[escalation]]
after_min = 0
action = "notify"
text = "⏰ Wake-up check-in! Complete the reminder to stop the alarm."

[[escalation]]
after_min = 5
action = "notify"
text = "⏰ 5 minutes and no check-in. Tattling in 10."

[[escalation]]
after_min = 10
action = "notify"
text = "⏰ 10 minutes. Last 5."

[[escalation]]
after_min = 15
action = "tattle"
to = ["+10000000001"]
text = "(automated) This is {name}'s wake-up bot. The {time} alarm has gone unanswered for 15 minutes. Please give them a nudge."

[tattle]
# false drops every tattle step, so nobody else is ever messaged.
enabled = true
name = "me"
