# Copy to config.local.toml (gitignored) and fill in your values. All times use [general].timezone.

[general]
timezone = "UTC"

[imessage]
# Your own phone number in E.164 form; must be the iMessage number of the Apple ID signed in on this Mac.
self = "+10000000000"

[wake]
time = "09:00"
weekdays = [1, 2, 3, 4, 5, 6, 7]
keywords = ["up", "awake", "checkin"]
hard_timeout_min = 60

[bedtime]
enabled = true
remind_at = "23:30"
keywords = ["bed", "sleep", "goodnight"]

[reminders]
# A reminder is created in this existing list ahead of wake time; completing it on your phone is the check-in.
enabled = true
list = "Reminders"
title = "☀️ Wake-up check-in"
create_ahead_min = 60

[alarm]
enabled = true
sound = "/System/Library/Sounds/Sosumi.aiff"
volume = 80
interval_sec = 2

# Steps run after_min minutes past wake time without a check-in: notify = message you, tattle = message `to`, shell = run cmd.
[[escalation]]
after_min = 0
action = "notify"
text = "⏰ Wake-up check-in! Reply with a keyword to stop the alarm."

[[escalation]]
after_min = 5
action = "notify"
text = "⏰ 5 minutes and no check-in. Tattling in 10."

[[escalation]]
after_min = 10
action = "notify"
text = "⏰ 10 minutes. Last 5."

[[escalation]]
after_min = 15
action = "tattle"
to = ["+10000000001"]
text = "(automated) This is {name}'s wake-up bot. The {time} alarm has gone unanswered for 15 minutes. Please give them a nudge."

[tattle]
name = "me"
